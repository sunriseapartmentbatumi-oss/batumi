name: Deploy production

# Wyłącznie ręczne uruchomienie. Scalenie do main NIE wdraża na produkcję (D033, D060).
# Środowisko `production` musi mieć w GitHub włączone "Required reviewers" (Robert/Konrad).
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Wpisz PUBLISH, aby potwierdzić publikację produkcyjną (Robert lub Konrad)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      CONFIRM: ${{ inputs.confirm }}
      REF: ${{ github.ref }}
    steps:
      - name: Sprawdź potwierdzenie i gałąź
        run: |
          if [ "$CONFIRM" != "PUBLISH" ]; then
            echo "::error::Brak potwierdzenia. Wpisz dokładnie PUBLISH w polu 'confirm'."
            exit 1
          fi
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Publikacja produkcyjna jest dozwolona tylko z gałęzi main."
            exit 1
          fi

      - name: Sprawdź sekrety Vercel
        run: |
          missing=0
          for v in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Brak sekretu $v w GitHub Environment 'production'. Zobacz docs/SETUP.md."
              missing=1
            fi
          done
          exit $missing

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test

      - name: Pobierz konfigurację Vercel (production)
        run: npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
      - name: Build
        run: npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
      - name: Deploy
        run: npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"
